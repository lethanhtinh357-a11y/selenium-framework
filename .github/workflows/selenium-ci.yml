name: Selenium Matrix CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run test
        run: mvn test -Dbrowser=${{ matrix.browser }} -Denv=dev -DsuiteXmlFile=testng-smoke.xml

      - name: Upload artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/screenshots/